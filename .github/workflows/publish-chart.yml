name: Publish Helm chart

on:
  push:
    branches:
      - main
    paths:
      - 'charts/cosmos-dashboard/**'
      - '.github/workflows/publish-chart.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Lint chart
        run: helm lint charts/cosmos-dashboard --strict

      - name: Render chart
        run: helm template cosmos-dashboard charts/cosmos-dashboard --namespace cosmos-dashboard

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Package and publish chart
        run: |
          chart_version="$(awk '/^version:/ {print $2}' charts/cosmos-dashboard/Chart.yaml)"
          helm package charts/cosmos-dashboard --destination "${RUNNER_TEMP}"
          helm push "${RUNNER_TEMP}/cosmos-dashboard-${chart_version}.tgz" \
            oci://ghcr.io/${{ github.repository_owner }}
