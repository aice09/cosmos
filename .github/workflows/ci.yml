name: Build dashboard

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Lint Helm chart
        run: helm lint charts/cosmos-dashboard --strict

      - name: Render Helm chart
        run: helm template cosmos-dashboard charts/cosmos-dashboard --namespace cosmos-dashboard

      - name: Build container image
        run: docker build --tag cosmos-dashboard:${{ github.sha }} .

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cosmos-dashboard:${{ github.sha }}
          format: table
          exit-code: '1'
          vuln-type: os,library
          severity: CRITICAL

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze source
        uses: github/codeql-action/analyze@v3
