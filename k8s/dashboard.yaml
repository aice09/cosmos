apiVersion: v1
kind: Namespace
metadata:
  name: cosmos-dashboard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cosmos-dashboard
  namespace: cosmos-dashboard
  labels:
    app.kubernetes.io/name: cosmos-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cosmos-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cosmos-dashboard
    spec:
      serviceAccountName: cosmos-dashboard
      automountServiceAccountToken: true
      nodeSelector:
        kubernetes.io/hostname: homepc05
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: localhost/cosmos-dashboard:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
            - name: TRIVY_SCAN_VERSION
              value: v0.76.1
            - name: TRIVY_SCAN_CACHE_DIR
              value: /home/nextjs/.cache/trivy-scan
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /security
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /security
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /security
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cosmos-dashboard
  namespace: cosmos-dashboard
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: cosmos-dashboard
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30080
      protocol: TCP
